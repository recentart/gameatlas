<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddle Duel · GameAtlas Originals</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/play/shared/shell.css">
</head>
<body>
<div class="stage"><canvas id="c" aria-label="Paddle Duel playfield" role="img"></canvas></div>
<div class="hud" aria-live="polite"><span class="tag p1" id="s1">0</span><span class="tag p2" id="s2">0</span></div>
<p class="pause-note">P or Start to pause</p>
<div class="overlay" id="menu">
  <div class="panel">
    <h1>Paddle Duel</h1>
    <p>Return the ball past your opponent. It speeds up every hit. First to 7.</p>
    <h2>Mode</h2>
    <div class="options" data-opt="mode">
      <button data-value="cpu">1 player vs computer</button>
      <button data-value="2p">2 players</button>
    </div>
    <div id="diff-row">
      <h2>Computer</h2>
      <div class="options" data-opt="diff">
        <button data-value="easy">Easy</button><button data-value="normal">Normal</button><button data-value="hard">Hard</button>
      </div>
    </div>
    <h2>Controls</h2>
    <ul>
      <li><span class="p1">Left</span>: <kbd>W</kbd> / <kbd>S</kbd> (in 1-player mode arrow keys work too)</li>
      <li><span class="p2">Right</span>: <kbd>↑</kbd> / <kbd>↓</kbd></li>
      <li>Touch: drag on your side. Gamepads: left stick or d-pad.</li>
    </ul>
    <div class="actions"><button class="btn btn-primary" id="start" type="button" autofocus>Start</button></div>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="panel status">
    <h1 id="winner">Winner</h1>
    <p id="final"></p>
    <div class="actions center"><button class="btn btn-primary" id="again" type="button">Play again</button><button class="btn" id="tomenu" type="button">Change mode</button></div>
  </div>
</div>
<script src="/play/shared/shell.js"></script>
<script src="/play/paddle-duel/game.js"></script>
</body>
</html>
